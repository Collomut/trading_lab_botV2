[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-v2"
version = "0.1.0"
description = "Model-based crypto trading system with deterministic hard risk controls and a fair baseline-vs-challenger protocol."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "ccxt>=4.5.92",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "ta>=0.11.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["config*", "data*", "models*", "backtest*", "risk*", "execution*", "live*", "monitoring*", "state*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
